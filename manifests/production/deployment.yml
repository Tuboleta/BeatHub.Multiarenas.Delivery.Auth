apiVersion : apps/v1
kind: Deployment
metadata:
  name: beathubmultiarenasdeliveryauth
  namespace: multiarenas-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beathubmultiarenasdeliveryauth
  template:
    metadata:
      labels:
        app: beathubmultiarenasdeliveryauth
    spec:
      imagePullSecrets:
        - name: acr-pull-secret
      containers:
        - name: beathubmultiarenasdeliveryauth
          image: beathubconnectposcontainer.azurecr.io/beathubmultiarenasdeliveryauth
          ports:
          - containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: "/api/v1/auth"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://bhpostgresqlbiteup.postgres.database.azure.com:5432/bite_up_prod?currentSchema=auth,public"
            - name: SPRING_DATASOURCE_USERNAME
              value: "tbpostgresa"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "NYz*bb*&8rrF1qxI"
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "validate"
            - name: SPRING_JPA_SHOW_SQL
              value: "false"
            - name: SPRING_FLYWAY_ENABLED
              value: "true"
            - name: CORS_ALLOWED_ORIGINS
              value: "*"
            - name: JWT_SECRET
              value: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
            - name: JWT_ISSUER
              value: "beathub-auth-service"
            - name: AZURE_SSO_ENABLED
              value: "true"
            - name: AZURE_SSO_JWKS_URL
              value: "https://ssoauthp.b2clogin.com/ssoauthp.onmicrosoft.com/b2c_1a_signup_signin_passwordless/discovery/v2.0/keys"
            - name: AZURE_SSO_WELL_KNOWN_URL
              value: "https://ssoauthp.b2clogin.com/ssoauthp.onmicrosoft.com/B2C_1A_SIGNUP_SIGNIN_PASSWORDLESS/v2.0/.well-known/openid-configuration"
            - name: AZURE_SSO_CLIENT_ID
              value: "43546991-88fa-4922-bd73-5041dadffbc5"
            - name: AZURE_SSO_ISSUER
              value: "https://ssoauthp.b2clogin.com/89229765-5396-43d9-bede-aaf2dd22af74/v2.0/"
            - name: AZURE_SSO_VALIDATE_SIGNATURE
              value: "true"
            - name: AZURE_SSO_VALIDATE_AUDIENCE
              value: "true"
            - name: AZURE_SSO_VALIDATE_ISSUER
              value: "false"
            - name: AZURE_SSO_CLOCK_SKEW_SECONDS
              value: "120"
            - name: SPRING_DATA_REDIS_HOST
              value: "redis.multiarenas-prod.svc.cluster.local"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_DATA_REDIS_PASSWORD
              value: ""
            - name: APP_AUDIT_ENABLED
              value: "true"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"          
            limits:
              cpu: "1"
              memory: "1Gi"

