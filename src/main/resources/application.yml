server:
  max-http-request-header-size: 64KB
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/api/v1/auth}

spring:
  application:
    name: beathub-delivery-auth

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/beathub_db?currentSchema=auth,public}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: auth
        jdbc:
          batch_size: 25
    open-in-view: false

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    create-schemas: true
    schemas: auth
    default-schema: auth
    baseline-on-migrate: false
    locations: classpath:db/migration

# Configuración JWT y SSO Azure
security:
  jwt:
    secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 Horas
    issuer: "beathub-auth-service"
  sso:
    azure:
      enabled: ${AZURE_SSO_ENABLED:true}
      jwks-url: ${AZURE_SSO_JWKS_URL:https://ssopreprod.b2clogin.com/ssopreprod.onmicrosoft.com/b2c_1a_passwordless_signin-optpass/discovery/v2.0/keys}
      well-known-url: ${AZURE_SSO_WELL_KNOWN_URL:https://ssopreprod.b2clogin.com/ssopreprod.onmicrosoft.com/B2C_1A_PASSWORDLESS_SIGNIN-OPTPASS/v2.0/.well-known/openid-configuration}
      client-id: ${AZURE_SSO_CLIENT_ID:63f8ef93-042a-40eb-a2f0-ba7b574e5ea6}
      accepted-client-ids:
        - ${AZURE_SSO_CLIENT_ID:63f8ef93-042a-40eb-a2f0-ba7b574e5ea6}
      issuer: ${AZURE_SSO_ISSUER:https://ssopreprod.b2clogin.com/bea47667-153a-452f-9723-8e8b4071f126/v2.0/}
      validate-signature: ${AZURE_SSO_VALIDATE_SIGNATURE:true}
      validate-audience: ${AZURE_SSO_VALIDATE_AUDIENCE:true}
      validate-issuer: ${AZURE_SSO_VALIDATE_ISSUER:false}
      clock-skew-seconds: ${AZURE_SSO_CLOCK_SKEW_SECONDS:120}
      cache-ttl-minutes: ${AZURE_SSO_CACHE_TTL_MINUTES:60}


# Springdoc OpenAPI 3 / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true

# Spring Boot Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

# CORS Config
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: false
  max-age: 3600

# Integración SSO ADS TBL
services:
  ads-sso:
    url: ${SERVICES_ADS_SSO_URL:https://sso.tbl.mock}
    client-id: ${SERVICES_ADS_CLIENT_ID:beathub-client}
    client-secret: ${SERVICES_ADS_CLIENT_SECRET:mock-secret}
